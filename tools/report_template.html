<!DOCTYPE html>
<!--
  cephtrace report - self-contained, no external dependencies.
  Generated by tools/cephtrace_report.py --html.  The placeholder below is
  replaced with a compact JSON payload of precomputed aggregates; all
  rendering and interactivity is vanilla JS over that payload.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cephtrace report</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2933; --muted: #7b8794;
    --line: #e4e7eb; --accent: #2f6f9f; --accent2: #4a9fd4;
    --warn: #d9822b; --bad: #c0392b; --good: #3a9d6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin: 0 0 18px;
  }
  .card h2 { font-size: 14px; margin: 0 0 14px; font-weight: 600; }
  .card h2 .hint { color: var(--muted); font-weight: 400; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; }
  .stat {
    flex: 1 1 110px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .stat .v { font-size: 22px; font-weight: 650; letter-spacing: -0.5px; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase;
             letter-spacing: 0.4px; }
  /* horizontal stage bars */
  .hbar { display: grid; grid-template-columns: 110px 1fr 48px;
          align-items: center; gap: 10px; margin: 6px 0; }
  .hbar .lab { color: var(--muted); text-align: right; font-size: 13px; }
  .hbar .track { background: var(--bg); border-radius: 6px; height: 18px;
                 overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .hbar .pc { font-variant-numeric: tabular-nums; font-size: 13px; }
  /* vertical bar charts (histogram, timeline).  align-items:stretch (the
     default) makes every .col fill the 150px height, so the bars' percentage
     heights resolve against a definite parent. */
  .vbars { display: flex; align-items: stretch; gap: 3px; height: 150px;
           border-bottom: 1px solid var(--line); }
  .vbars .col { flex: 1 1 0; display: flex; flex-direction: column;
                justify-content: flex-end; min-width: 0; cursor: default; }
  .vbars .b { background: var(--accent); border-radius: 3px 3px 0 0;
              transition: opacity .1s; min-height: 1px; }
  .vbars .col:hover .b { opacity: .65; }
  .axis { display: flex; gap: 3px; margin-top: 4px; }
  .axis span { flex: 1 1 0; text-align: center; color: var(--muted);
               font-size: 10px; overflow: hidden; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px;
           border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td.obj { text-align: left; font-family: ui-monospace, SFMono-Regular,
           Menlo, monospace; font-size: 12px; max-width: 0; width: 99%;
           overflow: hidden; text-overflow: ellipsis; }
  th { color: var(--muted); font-weight: 600; cursor: pointer;
       user-select: none; }
  th.sorted::after { content: " \25BE"; }
  th.asc::after { content: " \25B4"; }
  tbody tr.sel { background: #eaf2f8; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: #f0f4f8; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px;
          font-size: 11px; font-weight: 600; }
  .pill.r { background: #e7f1fb; color: var(--accent); }
  .pill.w { background: #fbeee2; color: var(--warn); }
  .filterbar { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .filterbar b { color: var(--ink); }
  .filterbar button { font: inherit; color: var(--accent);
    background: none; border: none; cursor: pointer; padding: 0;
    text-decoration: underline; }
  #tip { position: fixed; pointer-events: none; z-index: 10; opacity: 0;
    background: #1f2933; color: #fff; padding: 5px 9px; border-radius: 6px;
    font-size: 12px; transition: opacity .08s; white-space: nowrap; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 26px; }
  .foot code { background: var(--card); border: 1px solid var(--line);
               border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">cephtrace report</h1>
  <p class="sub" id="subtitle"></p>

  <div class="stats" id="stats"></div>

  <div class="card" id="stagesCard" hidden>
    <h2>Where the time goes
      <span class="hint">- share of total latency (stages overlap)</span></h2>
    <div id="stages"></div>
  </div>

  <div class="card">
    <h2 id="histTitle">Latency distribution</h2>
    <p class="filterbar" id="histFilter" hidden></p>
    <div class="vbars" id="hist"></div>
    <div class="axis" id="histAxis"></div>
  </div>

  <div class="card">
    <h2>Latency over the capture
      <span class="hint">- p95 per slice, in arrival order &rarr;</span></h2>
    <div class="vbars" id="timeline"></div>
  </div>

  <div class="card" id="groupCard">
    <h2 id="groupTitle"></h2>
    <p class="filterbar"><span id="groupHint"></span></p>
    <table id="groupTable"></table>
  </div>

  <div class="card">
    <h2>Slowest ops</h2>
    <table id="slowTable"></table>
  </div>

  <p class="foot" id="foot"></p>
</div>

<div id="tip"></div>

<script>
const DATA = __CEPHTRACE_DATA__;

const tip = document.getElementById("tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  tip.style.left = (e.clientX + 12) + "px";
  tip.style.top = (e.clientY + 12) + "px";
}
function hideTip() { tip.style.opacity = 0; }

function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(c => n.appendChild(
    typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}

// color a histogram bucket by how slow it is
function bucketColor(label) {
  if (label.indexOf("ms") < 0) return "var(--accent)";        // sub-ms
  const ms = parseFloat(label.replace(/[<>=]/g, ""));
  if (ms >= 64) return "var(--bad)";
  if (ms >= 16) return "var(--warn)";
  return "var(--accent2)";
}

function renderStats() {
  const s = DATA.summary, box = document.getElementById("stats");
  const cards = [["ops", s.ops.toLocaleString()],
                 ["p50", s.p50], ["p95", s.p95],
                 ["p99", s.p99], ["max", s.max]];
  if (DATA.kind === "radostrace")
    cards.splice(1, 0, ["read / write", s.reads + " / " + s.writes]);
  cards.forEach(([k, v]) => box.appendChild(
    el("div", {class: "stat"},
       [el("div", {class: "v"}, [String(v)]),
        el("div", {class: "k"}, [k])])));
}

function renderStages() {
  if (DATA.kind !== "osdtrace") return;
  document.getElementById("stagesCard").hidden = false;
  const host = document.getElementById("stages");
  const rows = DATA.stages.slice();
  if (DATA.kvCommit) rows.push(["+kv_commit (rocksdb)", DATA.kvCommit, 1]);
  rows.forEach(([name, pc, sub]) => {
    const fill = el("div", {class: "fill"});
    fill.style.width = Math.max(1, pc) + "%";
    if (sub) fill.style.background = "var(--good)";
    host.appendChild(el("div", {class: "hbar"},
      [el("div", {class: "lab"}, [name]),
       el("div", {class: "track"}, [fill]),
       el("div", {class: "pc"}, [pc + "%"])]));
  });
}

let histGroup = null;  // null = all

function renderHist() {
  const counts = histGroup === null ? DATA.histOverall
                                    : DATA.histGroups[histGroup];
  const host = document.getElementById("hist");
  const axis = document.getElementById("histAxis");
  host.innerHTML = ""; axis.innerHTML = "";
  const peak = Math.max(1, ...counts);
  DATA.histLabels.forEach((label, i) => {
    const bar = el("div", {class: "b"});
    bar.style.height = (100 * counts[i] / peak) + "%";
    bar.style.background = bucketColor(label);
    const col = el("div", {class: "col"}, [bar]);
    col.onmousemove = e => showTip(e,
      "<b>" + counts[i].toLocaleString() + "</b> ops " + label);
    col.onmouseleave = hideTip;
    host.appendChild(col);
    axis.appendChild(el("span", {title: label}, [label]));
  });
  const fb = document.getElementById("histFilter");
  if (histGroup === null) { fb.hidden = true; }
  else {
    fb.hidden = false; fb.innerHTML = "";
    fb.appendChild(document.createTextNode(
      "filtered to " + DATA.groupLabel.toLowerCase() + " "));
    fb.appendChild(el("b", {}, [labelFor(histGroup)]));
    fb.appendChild(document.createTextNode(" · "));
    const btn = el("button", {}, ["show all"]);
    btn.onclick = () => setGroup(null);
    fb.appendChild(btn);
  }
}

function labelFor(id) {
  return (DATA.groupLabel === "OSD" ? "osd." : "pool ") + id;
}

function setGroup(id) {
  histGroup = id;
  document.getElementById("histTitle").textContent =
    "Latency distribution" + (id === null ? "" : " - " + labelFor(id));
  renderHist();
  document.querySelectorAll("#groupTable tbody tr").forEach(tr =>
    tr.classList.toggle("sel", tr.dataset.id === String(id)));
}

function renderTimeline() {
  const host = document.getElementById("timeline");
  const peak = Math.max(1, ...DATA.timeline.map(s => s.p95));
  DATA.timeline.forEach((s, i) => {
    const bar = el("div", {class: "b"});
    bar.style.height = (100 * s.p95 / peak) + "%";
    bar.style.background = "var(--accent)";
    const col = el("div", {class: "col"}, [bar]);
    col.onmousemove = e => showTip(e,
      "slice " + (i + 1) + "/" + DATA.timeline.length +
      "<br>p95 <b>" + fmtUs(s.p95) + "</b> · p50 " + fmtUs(s.p50) +
      " · " + s.n + " ops");
    col.onmouseleave = hideTip;
    host.appendChild(col);
  });
}

function fmtUs(v) {
  if (v < 1000) return Math.round(v) + "us";
  if (v < 1e6) return (v / 1000).toFixed(1) + "ms";
  return (v / 1e6).toFixed(2) + "s";
}

// generic sortable table
function makeTable(node, cols, rows, opts) {
  opts = opts || {};
  let sortIdx = opts.sort == null ? 1 : opts.sort, asc = false;
  function draw() {
    node.innerHTML = "";
    const thead = el("tr", {});
    cols.forEach((c, i) => {
      const th = el("th", {}, [c.h]);
      if (i === sortIdx) th.classList.add(asc ? "asc" : "sorted");
      th.onclick = () => {
        if (i === sortIdx) asc = !asc; else { sortIdx = i; asc = false; }
        draw();
      };
      thead.appendChild(th);
    });
    node.appendChild(el("thead", {}, [thead]));
    const body = el("tbody", {});
    const sorted = rows.slice().sort((a, b) => {
      const x = a[cols[sortIdx].k], y = b[cols[sortIdx].k];
      const d = (typeof x === "number" && typeof y === "number")
                ? x - y : String(x).localeCompare(String(y));
      return asc ? d : -d;
    });
    sorted.forEach(r => {
      const tr = el("tr", {});
      if (opts.id) { tr.dataset.id = r[opts.id]; tr.classList.add("click"); }
      cols.forEach(c => {
        const td = el("td", c.cls ? {class: c.cls} : {});
        td.innerHTML = c.fmt ? c.fmt(r[c.k], r) : r[c.k];
        tr.appendChild(td);
      });
      if (opts.onclick) tr.onclick = () => opts.onclick(r);
      body.appendChild(tr);
    });
    node.appendChild(body);
  }
  draw();
}

function renderGroups() {
  document.getElementById("groupTitle").textContent =
    "Per-" + DATA.groupLabel + " latency";
  document.getElementById("groupHint").textContent =
    "click a row to filter the histogram above";
  const cols = [
    {h: DATA.groupLabel, k: "label"},
    {h: "ops", k: "count", fmt: v => v.toLocaleString()},
    {h: "p50", k: "p50", fmt: fmtUs},
    {h: "p95", k: "p95", fmt: fmtUs},
    {h: "max", k: "max", fmt: fmtUs},
  ];
  DATA.groups.forEach(g => { g.label = labelFor(g.id); });
  makeTable(document.getElementById("groupTable"), cols, DATA.groups,
    {sort: 3, id: "id", onclick: g => setGroup(g.id)});
}

function renderSlowest() {
  let cols;
  if (DATA.kind === "osdtrace") {
    cols = [
      {h: "latency", k: "lat", fmt: fmtUs},
      {h: "type", k: "op"},
      {h: "osd", k: "osd", fmt: v => "osd." + v},
      {h: "pg", k: "pg"}, {h: "size", k: "size"},
    ];
  } else {
    cols = [
      {h: "latency", k: "lat", fmt: fmtUs},
      {h: "rw", k: "wr", fmt: v => '<span class="pill ' +
        v.toLowerCase() + '">' + v + "</span>"},
      {h: "pool", k: "pool"},
      {h: "object", k: "obj", cls: "obj"},
    ];
  }
  makeTable(document.getElementById("slowTable"), cols, DATA.slowest,
            {sort: 0});
}

document.getElementById("title").textContent =
  DATA.kind + " report";
document.getElementById("subtitle").textContent =
  DATA.summary.ops.toLocaleString() + " ops · " +
  DATA.summary.byType.map(t => t[0] + " " + t[1]).join("  ·  ");
document.getElementById("foot").innerHTML =
  "Generated by <code>cephtrace_report.py --html</code> · " +
  "no external dependencies · for the numbers, see the matching analyzer.";

renderStats();
renderStages();
renderHist();
renderTimeline();
renderGroups();
renderSlowest();
</script>
</body>
</html>
